<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #a8e6cf 0%, #dcedc1 100%);
    min-height: 100vh;
    padding: max(15px, env(safe-area-inset-top)) 15px 30px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    padding: 22px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; text-align: center; color: #2d6a4f; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #888; font-size: 12px; margin-bottom: 18px; }
  .section-title {
    font-size: 14px; font-weight: bold; color: #2d6a4f;
    background: #eafaf1; padding: 8px 12px; border-radius: 8px;
    margin: 16px 0 10px;
  }
  .row { display: flex; align-items: center; margin-bottom: 10px; gap: 8px; }
  label { font-size: 14px; color: #444; width: 118px; flex-shrink: 0; }
  .input-wrap {
    display: flex; align-items: center; flex: 1;
    background: #f5f7f6; border-radius: 10px;
    padding: 11px 12px; border: 1px solid #e0e5e2;
  }
  .input-wrap:focus-within { border-color: #52b788; background: #fff; }
  input { border: none; outline: none; background: transparent; font-size: 17px; width: 100%; color: #333; }
  .unit { font-size: 13px; color: #999; margin-left: 6px; white-space: nowrap; }
  .result-box {
    margin-top: 18px; background: linear-gradient(135deg, #52b788, #40916c);
    border-radius: 14px; padding: 18px; text-align: center; color: #fff;
  }
  .result-box .big { font-size: 42px; font-weight: bold; margin: 4px 0; }
  .detail {
    font-size: 13px; opacity: 0.95; line-height: 1.8; margin-top: 10px;
    text-align: left; background: rgba(255,255,255,0.15);
    border-radius: 10px; padding: 10px 14px;
  }
  .warning {
    margin-top: 14px; font-size: 12px; color: #b5651d; background: #fff3e0;
    border-radius: 10px; padding: 10px 14px; line-height: 1.6;
  }
  .error { color: #d64545; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
  /* 历史记录 */
  .history { margin-top: 16px; }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #f5f7f6; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 8px; font-size: 13px; color: #444;
  }
  .history-item b { color: #2d6a4f; font-size: 15px; }
  .del-btn { color: #d64545; font-size: 18px; padding: 4px 8px; }
  .clear-btn {
    width: 100%; margin-top: 6px; padding: 10px;
    border: none; border-radius: 10px; background: #eee;
    color: #888; font-size: 13px;
  }
  /* 大按钮保存 */
  .save-btn {
    width: 100%; margin-top: 14px; padding: 14px;
    border: none; border-radius: 12px;
    background: #2d6a4f; color: #fff; font-size: 16px; font-weight: bold;
  }
  .save-btn:active { opacity: 0.85; }
</style>

<body>
<div class="card">
  <h1>🐱 猫咪胰岛素剂量计算器</h1>
  <div class="subtitle">稀释胰岛素 · 按体重精确计算注射量</div>

  <div class="section-title">第一步：稀释后胰岛素浓度</div>
  <div class="row">
    <label>稀释前总单位数</label>
    <div class="input-wrap">
      <input type="number" id="totalUnits" value="300" step="any" inputmode="decimal">
      <span class="unit">单位</span>
    </div>
  </div>
  <div class="row">
    <label>稀释前总体积</label>
    <div class="input-wrap">
      <input type="number" id="totalMl" value="3" step="any" inputmode="decimal">
      <span class="unit">ml</span>
    </div>
  </div>
  <div class="row">
    <label>每次抽取体积</label>
    <div class="input-wrap">
      <input type="number" id="drawMl" value="0.1" step="any" inputmode="decimal">
      <span class="unit">ml</span>
    </div>
  </div>
  <div class="row">
    <label>稀释至体积</label>
    <div class="input-wrap">
      <input type="number" id="diluteMl" value="1" step="any" inputmode="decimal">
      <span class="unit">ml</span>
    </div>
  </div>

  <div class="section-title">第二步：猫咪信息</div>
  <div class="row">
    <label>猫咪体重</label>
    <div class="input-wrap">
      <input type="number" id="weight" value="4.45" step="any" inputmode="decimal">
      <span class="unit">kg</span>
    </div>
  </div>
  <div class="row">
    <label>每kg剂量</label>
    <div class="input-wrap">
      <input type="number" id="dosePerKg" value="0.3" step="any" inputmode="decimal">
      <span class="unit">单位/kg</span>
    </div>
  </div>

  <div class="error" id="error">⚠️ 请输入有效的正数</div>

  <div class="result-box">
    <div>应注射的稀释胰岛素量</div>
    <div class="big"><span id="result">--</span> ml</div>
    <div class="detail" id="detail"></div>
  </div>

  <button class="save-btn" onclick="saveRecord()">💾 记录本次注射</button>

  <div class="section-title">📋 注射历史</div>
  <div id="history"></div>
  <button class="clear-btn" onclick="clearHistory()">清空历史记录</button>

  <div class="warning">
    ⚠️ <b>重要提示</b>：本工具仅供辅助参考，实际注射剂量请务必遵医嘱，并以血糖监测结果为准。注射前请再次核对计算结果。
  </div>
</div>

<script>
// ============ 计算 ============
function calc() {
  const totalUnits = parseFloat(document.getElementById('totalUnits').value);
  const totalMl    = parseFloat(document.getElementById('totalMl').value);
  const drawMl     = parseFloat(document.getElementById('drawMl').value);
  const diluteMl   = parseFloat(document.getElementById('diluteMl').value);
  const weight     = parseFloat(document.getElementById('weight').value);
  const dosePerKg  = parseFloat(document.getElementById('dosePerKg').value);

  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');
  const detailEl = document.getElementById('detail');

  const inputs = [totalUnits, totalMl, drawMl, diluteMl, weight, dosePerKg];
  if (inputs.some(v => isNaN(v) || v <= 0)) {
    errorEl.style.display = 'block';
    resultEl.textContent = '--';
    detailEl.textContent = '';
    return null;
  }
  errorEl.style.display = 'none';

  const originConc = totalUnits / totalMl;
  const dilutedConc = (originConc * drawMl) / diluteMl;
  const needUnits = weight * dosePerKg;
  const injectMl = needUnits / dilutedConc;

  resultEl.textContent = injectMl.toFixed(3);
  detailEl.innerHTML =
    `原液浓度：${totalUnits}÷${totalMl} = <b>${originConc.toFixed(2)}</b> 单位/ml<br>` +
    `稀释后浓度：<b>${dilutedConc.toFixed(2)}</b> 单位/ml<br>` +
    `所需剂量：${weight}kg × ${dosePerKg} = <b>${needUnits.toFixed(2)}</b> 单位<br>` +
    `注射体积：<b>${injectMl.toFixed(3)}</b> ml`;

  // 保存参数供记录用
  return { weight, dosePerKg, needUnits, injectMl, dilutedConc };
}

document.querySelectorAll('input').forEach(el => {
  el.addEventListener('input', () => {
    calc();
    saveInputs();
  });
});

// ============ 本地保存参数（下次打开自动恢复）============
function saveInputs() {
  const data = {};
  document.querySelectorAll('input').forEach(el => data[el.id] = el.value);
  localStorage.setItem('catInsulinInputs', JSON.stringify(data));
}
function loadInputs() {
  const saved = localStorage.getItem('catInsulinInputs');
  if (saved) {
    const data = JSON.parse(saved);
    for (const id in data) {
      const el = document.getElementById(id);
      if (el) el.value = data[id];
    }
  }
}

// ============ 注射历史 ============
function saveRecord() {
  const r = calc();
  if (!r) return;
  const list = JSON.parse(localStorage.getItem('catInsulinHistory') || '[]');
  list.unshift({
    time: new Date().toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }),
    ml: r.injectMl.toFixed(3),
    units: r.needUnits.toFixed(2),
    weight: r.weight
  });
  localStorage.setItem('catInsulinHistory', JSON.stringify(list.slice(0, 50)));
  renderHistory();
}
function renderHistory() {
  const list = JSON.parse(localStorage.getItem('catInsulinHistory') || '[]');
  const box = document.getElementById('history');
  if (list.length === 0) {
    box.innerHTML = '<div style="text-align:center;color:#bbb;font-size:13px;padding:10px;">暂无记录</div>';
    return;
  }
  box.innerHTML = list.map((item, i) =>
    `<div class="history-item">
      <div>${item.time} · ${item.weight}kg<br>需 ${item.units} 单位</div>
      <div><b>${item.ml} ml</b></div>
      <div class="del-btn" onclick="delRecord(${i})">✕</div>
    </div>`
  ).join('');
}
function delRecord(i) {
  const list = JSON.parse(localStorage.getItem('catInsulinHistory') || '[]');
  list.splice(i, 1);
  localStorage.setItem('catInsulinHistory', JSON.stringify(list));
  renderHistory();
}
function clearHistory() {
  if (confirm('确定清空所有注射记录吗？')) {
    localStorage.removeItem('catInsulinHistory');
    renderHistory();
  }
}

loadInputs();
calc();
renderHistory();
</script>
</body>
</html>
